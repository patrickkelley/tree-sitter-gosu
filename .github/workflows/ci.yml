name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  grammar:
    name: Grammar (generate + corpus)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx tree-sitter generate
      - run: git diff --exit-code
      - run: npx tree-sitter test
      - run: cd templates && npx tree-sitter generate
      - run: git diff --exit-code
      - run: cd templates && npx tree-sitter test
      - run: ./scripts/audit.sh examples

  rust:
    name: Rust binding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test
